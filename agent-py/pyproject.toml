[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.11, <3.15"

dependencies = [
    "livekit-agents[silero,turn-detector]==1.8.11",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv",
    # moss>=1.17 (inferedge-moss-core>=0.31) ships manylinux_2_28 wheels; older
    # releases need glibc 2.38+ and fail on Debian 12 / Ubuntu 22.04.
    "moss>=1.24",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.x was published with only cp310 wheels and no sdist, so it can't
# install on Python 3.11+. Skip it; 1.25.1+ has wheels for all versions (and
# livekit-api's aiohttp needs yarl>=1.25.1).
constraint-dependencies = ["yarl!=1.24.*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
